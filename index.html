
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario ECONOCOM</title>

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  margin:0;
  padding:15px;
  color:#222;
  max-width:850px;
  margin:auto;
}
h1{font-size:23px}
.panel{
  background:white;
  padding:16px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 2px 7px #0001;
}
button,input{
  width:100%;
  padding:12px;
  margin:6px 0;
  font-size:16px;
  border-radius:8px;
  border:1px solid #bbb;
}
button{
  background:#174b78;
  color:white;
  border:0;
  font-weight:bold;
}
button.secondary{background:#64748b}
button:disabled{opacity:.45}
video{
  width:100%;
  background:#111;
  border-radius:10px;
  max-height:400px;
}
.status{
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  background:#edf1f5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.good{background:#d9f4df;color:#14532d}
.warn{background:#fff0cc;color:#744b00}
.bad{background:#fde0e0;color:#8b1d1d}
.candidate{
  border:1px solid #ccd3dc;
  padding:12px;
  border-radius:9px;
  margin:10px 0;
}
.candidate strong{display:block;margin-bottom:7px}
.small{font-size:13px;color:#596575}
.hidden{display:none}
</style>
</head>

<body>

<h1>Inventario ECONOCOM</h1>

<div class="panel">
  <h3>1. Cargar Excel</h3>
  <input type="file" id="file" accept=".xlsx,.xlsm">
  <div id="fileStatus" class="status">
    Selecciona tu Excel de inventario.
  </div>
</div>

<div class="panel">
  <h3>2. Leer código de barras</h3>

  <video id="video" playsinline muted></video>

  <button id="startBtn">Abrir cámara</button>
  <button id="stopBtn" class="secondary" disabled>Detener cámara</button>

  <button id="torchBtn" class="secondary hidden">
    Encender linterna
  </button>

  <div id="scanStatus" class="status">
    Esperando cámara.
  </div>

  <h4>Introducir código manualmente</h4>

  <input
    id="manualCode"
    placeholder="Ej.: *05Y1J9%S250037"
  >

  <button id="searchBtn">
    Buscar en Excel
  </button>
</div>

<div class="panel">
  <h3>3. Resultados</h3>

  <div id="resultInfo" class="status">
    Todavía no hay resultados.
  </div>

  <div id="candidates"></div>
</div>

<div class="panel">
  <h3>4. Exportar inventario</h3>

  <button id="exportBtn" disabled>
    Descargar Excel actualizado
  </button>
</div>

<script>
const $ = id => document.getElementById(id);

let workbook = null;
let worksheet = null;
let headers = null;
let workbookName = "Inventario_ECONOCOM_actualizado.xlsx";

let reader = null;
let controls = null;
let activeTrack = null;
let torchOn = false;

function normalize(value){
  return String(value ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toUpperCase()
    .replace(/[^A-Z0-9]/g,"");
}

function cellText(cell){
  if(!cell || cell.value == null) return "";

  const v=cell.value;

  if(typeof v==="object"){
    if(v.text) return String(v.text);
    if(v.richText) return v.richText.map(x=>x.text).join("");
    if(v.result!=null) return String(v.result);
  }

  return String(v);
}

function status(id,text,type=""){
  $(id).textContent=text;
  $(id).className="status "+type;
}

/* 
   CONVERSIÓN DEL CÓDIGO DE BARRAS

   Original:
   *05Y1J9%S250037

   Resultado:
   P/N = 05Y1J9
   STOCK-ID = S250037

   Se eliminan los asteriscos y porcentajes.
*/

function parseBarcode(raw){

  const value=String(raw || "")
    .trim()
    .toUpperCase()
    .replace(/\s/g,"");

  const clean=value.replace(/^\*+|\*+$/g,"");

  const parts=clean.split("%");

  const pn=(parts[0] || "")
    .replace(/[^A-Z0-9]/g,"");

  const stock=(parts[1] || "")
    .replace(/[^A-Z0-9]/g,"");

  return {
    raw:value,
    pn:pn,
    stock:stock
  };
}

/*
  DETECCIÓN DE COLUMNAS DEL EXCEL
*/

function detectHeaders(ws){

  const aliases={
    pn:[
      "PN",
      "PARTNUMBER",
      "NUMEROPRODUCTO",
      "CODIGOPRODUCTO",
      "REFERENCIA",
      "PRODUCTNUMBER"
    ],

    stock:[
      "STOCKID",
      "IDSTOCK",
      "CODIGOALMACEN",
      "CODALMACEN",
      "STOCK"
    ],

    serial:[
      "NUMEROSERIE",
      "NSERIE",
      "SERIAL",
      "SERIALNUMBER"
    ],

    description:[
      "DESCRIPCION",
      "DESCRIPTION",
      "MODELO",
      "TMOD"
    ],

    location:[
      "UBICACION",
      "ESTANTERIA",
      "LOCATION",
      "SHELF"
    ]
  };

  const max=Math.min(ws.rowCount || 30,30);

  for(let r=1;r<=max;r++){

    const row=ws.getRow(r);
    const found={};

    row.eachCell((cell,col)=>{

      const value=normalize(cellText(cell));

      for(const key in aliases){

        if(aliases[key].includes(value) && !found[key]){
          found[key]=col;
        }

      }
    });

    if(found.pn || found.stock){
      return {row:r,cols:found};
    }
  }

  return null;
}

function getCell(row,col){
  return col ? cellText(row.getCell(col)) : "";
}

/*
  BÚSQUEDA DE COINCIDENCIAS

  P/N: coincidencia exacta.
  STOCK-ID: coincidencia parcial.

  Ejemplo:
  S250037 encuentra S25003774.
*/

function findCandidates(parsed){

  const cols=headers.cols;
  const found=[];

  const searchPN=normalize(parsed.pn);
  const searchStock=normalize(parsed.stock);

  worksheet.eachRow((row,rowNum)=>{

    if(rowNum<=headers.row)return;

    const pn=normalize(getCell(row,cols.pn));
    const stock=normalize(getCell(row,cols.stock));

    const pnMatch=
      searchPN && pn===searchPN;

    const stockMatch=
      searchStock && stock.includes(searchStock);

    if(pnMatch || stockMatch){

      found.push({

        rowNum,

        pn:getCell(row,cols.pn),

        stock:getCell(row,cols.stock),

        serial:getCell(row,cols.serial),

        description:getCell(row,cols.description),

        location:getCell(row,cols.location),

        pnMatch:!!pnMatch,

        stockMatch:!!stockMatch

      });
    }

  });

  /*
    Primero los que coinciden en ambos campos.
  */

  found.sort((a,b)=>
    (Number(b.pnMatch)+Number(b.stockMatch))-
    (Number(a.pnMatch)+Number(a.stockMatch))
  );

  return found;
}

/*
  CARGAR EXCEL
*/

$("file").addEventListener("change",async e=>{

  const file=e.target.files[0];

  if(!file)return;

  try{

    workbook=new ExcelJS.Workbook();

    const buffer=await file.arrayBuffer();

    await workbook.xlsx.load(buffer);

    workbookName=file.name.replace(/\.(xlsx|xlsm)$/i,"")
      +"_actualizado.xlsx";

    worksheet=workbook.worksheets.find(
      ws=>normalize(ws.name)!=="ENCONTRADOFUERASTOCK"
    ) || workbook.worksheets[0];

    headers=detectHeaders(worksheet);

    if(!headers){
      throw new Error(
        "No se han encontrado los encabezados P/N o STOCK-ID."
      );
    }

    const cols=headers.cols;

    let info=
      "Excel cargado correctamente.\n"+
      "Hoja: "+worksheet.name+"\n"+
      "Fila de encabezados: "+headers.row+"\n"+
      "P/N: columna "+(cols.pn || "NO DETECTADA")+"\n"+
      "STOCK-ID: columna "+(cols.stock || "NO DETECTADA");

    if(!cols.pn || !cols.stock){
      info+="\nATENCIÓN: falta detectar una de las dos columnas.";
    }

    $("fileStatus").textContent=info;

    $("exportBtn").disabled=false;

    status(
      "scanStatus",
      "Excel preparado. Puedes escanear o introducir el código.",
      "good"
    );

  }catch(err){

    workbook=null;
    worksheet=null;
    headers=null;

    status("fileStatus","Error: "+err.message,"bad");
  }
});

/*
  MOSTRAR CANDIDATOS
*/

function showCandidates(list,parsed){

  $("candidates").innerHTML="";

  if(!list.length){

    status(
      "resultInfo",
      "No se ha encontrado el artículo.\n"+
      "P/N: "+parsed.pn+"\n"+
      "STOCK-ID: "+parsed.stock,
      "warn"
    );

    const button=document.createElement("button");

    button.textContent="Añadir a ENCONTRADO FUERA STOCK";

    button.onclick=()=>addUnknown(parsed);

    $("candidates").appendChild(button);

    return;
  }

  status(
    "resultInfo",
    "Encontradas "+list.length+
    " coincidencia(s). Selecciona el artículo correcto.",
    "good"
  );

  list.forEach(item=>{

    const div=document.createElement("div");
    div.className="candidate";

    const title=document.createElement("strong");

    title.textContent=
      "P/N: "+(item.pn || "—")+
      " | STOCK-ID: "+(item.stock || "—");

    const detail=document.createElement("p");

    detail.textContent=
      "N.º serie: "+(item.serial || "—")+
      " | Ubicación: "+(item.location || "—");

    const description=document.createElement("p");

    description.textContent=
      "Descripción: "+(item.description || "—");

    const match=document.createElement("p");
    match.className="small";

    match.textContent=
      "Coincidencia: "+
      [
        item.pnMatch?"P/N exacto":"",
        item.stockMatch?"STOCK-ID parcial":""
      ].filter(Boolean).join(" + ");

    const button=document.createElement("button");

    button.textContent=
      "Confirmar y marcar fila "+item.rowNum+" en verde";

    button.onclick=()=>markFound(item);

    div.append(title,detail,description,match,button);

    $("candidates").appendChild(div);
  });
}

/*
  BUSCAR EN EL EXCEL
*/

function searchCode(raw){

  if(!workbook || !worksheet || !headers){

    status("resultInfo","Primero carga el Excel.","bad");
    return;
  }

  const parsed=parseBarcode(raw);

  if(!parsed.pn && !parsed.stock){

    status("resultInfo","No se ha podido interpretar el código.","bad");
    return;
  }

  $("manualCode").value=parsed.raw;

  const candidates=findCandidates(parsed);

  showCandidates(candidates,parsed);
}

$("searchBtn").addEventListener("click",()=>{
  searchCode($("manualCode").value);
});

$("manualCode").addEventListener("keydown",e=>{
  if(e.key==="Enter")searchCode(e.target.value);
});

/*
  MARCAR FILA SELECCIONADA EN VERDE
*/

function markFound(item){

  const row=worksheet.getRow(item.rowNum);

  row.eachCell({includeEmpty:true},cell=>{

    cell.fill={
      type:"pattern",
      pattern:"solid",
      fgColor:{argb:"FF92D050"}
    };

  });

  status(
    "resultInfo",
    "Artículo confirmado. Fila "+item.rowNum+
    " marcada en verde. Exporta el Excel para guardar los cambios.",
    "good"
  );

  $("candidates").innerHTML="";
}

/*
  AÑADIR ARTÍCULO NO ENCONTRADO
*/

function addUnknown(parsed){

  let ws=workbook.getWorksheet("ENCONTRADO FUERA STOCK");

  if(!ws){

    ws=workbook.addWorksheet("ENCONTRADO FUERA STOCK");

    ws.addRow([
      "P/N",
      "STOCK-ID leído",
      "Código de barras",
      "Fecha"
    ]);

    ws.getRow(1).font={bold:true};
  }

  const key=normalize(parsed.pn)+"|"+normalize(parsed.stock);

  let duplicate=false;

  for(let r=2;r<=ws.rowCount;r++){

    const existing=
      normalize(cellText(ws.getRow(r).getCell(1)))+"|"+
      normalize(cellText(ws.getRow(r).getCell(2)));

    if(existing===key)duplicate=true;
  }

  if(!duplicate){

    ws.addRow([
      parsed.pn,
      parsed.stock,
      parsed.raw,
      new Date().toLocaleString("es-ES")
    ]);
  }

  status(
    "resultInfo",
    duplicate
      ? "Este código ya estaba anotado."
      : "Artículo añadido a ENCONTRADO FUERA STOCK.",
    "good"
  );

  $("candidates").innerHTML="";
}

/*
  CÁMARA ZXING
*/

async function stopCamera(){

  try{
    if(controls)controls.stop();
  }catch(e){}

  try{
    if(reader)reader.reset();
  }catch(e){}

  const video=$("video");

  if(video.srcObject){
    video.srcObject.getTracks().forEach(track=>track.stop());
    video.srcObject=null;
  }

  controls=null;
  activeTrack=null;
  torchOn=false;

  $("startBtn").disabled=false;
  $("stopBtn").disabled=true;
  $("torchBtn").classList.add("hidden");
}

$("startBtn").addEventListener("click",async()=>{

  if(!workbook){
    status("scanStatus","Carga primero el Excel.","warn");
    return;
  }

  try{

    if(!window.ZXingBrowser){
      throw new Error("No se ha cargado ZXing. Comprueba Internet.");
    }

    reader=new ZXingBrowser.BrowserMultiFormatReader();

    status("scanStatus","Solicitando permiso para usar la cámara…");

    controls=await reader.decodeFromVideoDevice(
      undefined,
      $("video"),
      (result,error)=>{

        if(result){

          const code=result.getText();

          $("manualCode").value=code;

          searchCode(code);

          stopCamera();

          status(
            "scanStatus",
            "Código leído correctamente. Selecciona el artículo.",
            "good"
          );
        }
      }
    );

    $("startBtn").disabled=true;
    $("stopBtn").disabled=false;

    const video=$("video");

    video.onloadedmetadata=()=>{

      const stream=video.srcObject;

      activeTrack=stream && stream.getVideoTracks()[0];

      if(activeTrack && activeTrack.getCapabilities){

        const caps=activeTrack.getCapabilities();

        if(caps.torch){
          $("torchBtn").classList.remove("hidden");
        }
      }
    };

    status(
      "scanStatus",
      "Cámara activa. Enfoca el código de barras.",
      "good"
    );

  }catch(err){

    status(
      "scanStatus",
      "No se pudo abrir la cámara: "+err.message+
      "\nComprueba los permisos y que GitHub Pages utilice HTTPS.",
      "bad"
    );
  }
});

$("stopBtn").addEventListener("click",async()=>{
  await stopCamera();
  status("scanStatus","Cámara detenida.");
});

$("torchBtn").addEventListener("click",async()=>{

  if(!activeTrack)return;

  try{

    torchOn=!torchOn;

    await activeTrack.applyConstraints({
      advanced:[{torch:torchOn}]
    });

    $("torchBtn").textContent=
      torchOn?"Apagar linterna":"Encender linterna";

  }catch(error){

    torchOn=false;

    status(
      "scanStatus",
      "El Samsung o el navegador no permiten controlar la linterna. Puedes continuar sin ella.",
      "warn"
    );
  }
});

/*
  EXPORTAR COPIA DEL EXCEL
*/

$("exportBtn").addEventListener("click",async()=>{

  if(!workbook)return;

  try{

    const buffer=await workbook.xlsx.writeBuffer();

    const blob=new Blob(
      [buffer],
      {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}
    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;
    a.download=workbookName;
    a.click();

    setTimeout(()=>URL.revokeObjectURL(url),2000);

    status(
      "resultInfo",
      "Excel actualizado descargado. Comprueba la carpeta Descargas.",
      "good"
    );

  }catch(error){

    status(
      "resultInfo",
      "Error al exportar: "+error.message,
      "bad"
    );
  }
});

window.addEventListener("pagehide",stopCamera);

})();
</script>
</body>
</html>
